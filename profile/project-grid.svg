    </g>

    <g>
      <rect x="614" y="368" width="558" height="304" rx="18" fill="#121820" stroke="#2C3540"/>
      <text x="644" y="410" fill="#778390" font-size="11" font-weight="700" letter-spacing="2">04 · OPERATIONS</text>
      <text x="644" y="466" fill="#F0F2F5" font-size="34" font-weight="700">HR Payroll Management</text>
