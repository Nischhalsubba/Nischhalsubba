<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Selected product work</title>
  <desc id="desc">A restrained four-card editorial grid showing Napiyo, DesignOps Orchestrator, Neverwinter Live Parser, and HR Payroll Management.</desc>
  <rect width="1200" height="700" rx="26" fill="#0D1117"/>

  <g font-family="Arial, sans-serif">
