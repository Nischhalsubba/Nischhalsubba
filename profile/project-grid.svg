      <text x="58" y="70" fill="#778390" font-size="11" font-weight="700" letter-spacing="2">01 · LOCAL UTILITY</text>
      <text x="58" y="132" fill="#F0F2F5" font-size="40" font-weight="700">Napiyo</text>
      <text x="58" y="174" fill="#A3ACB7" font-size="16">Land measurement made local, practical, and clear.</text>
      <rect x="370" y="84" width="162" height="168" rx="14" fill="#0E141A" stroke="#34404B"/>
      <rect x="392" y="108" width="118" height="10" rx="5" fill="#CBD2DA" fill-opacity="0.78"/>
