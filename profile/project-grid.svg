      <text x="58" y="466" fill="#F0F2F5" font-size="34" font-weight="700">Neverwinter Live Parser</text>
      <text x="58" y="509" fill="#A3ACB7" font-size="16">Dense combat data translated into fast, useful decisions.</text>
