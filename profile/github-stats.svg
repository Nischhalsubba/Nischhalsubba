<svg xmlns="http://www.w3.org/2000/svg" width="900" height="286" viewBox="0 0 900 286" role="img" aria-labelledby="title desc">
  <title id="title">Nischhalsubba GitHub activity</title>
  <desc id="desc">Public GitHub activity summary with repositories, followers, stars, pull requests, merged pull requests, issues, and reviews.</desc>
  <style>
    .card{fill:#0d1117;stroke:#30363d}.title{fill:#f0f6fc;font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.value{fill:#f0f6fc;font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#8b949e;font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.accent{fill:#58a6ff;font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.note{fill:#8b949e;font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.divider{stroke:#21262d}
    @media (prefers-color-scheme: light){.card{fill:#ffffff;stroke:#d0d7de}.title,.value{fill:#1f2328}.label,.note{fill:#656d76}.accent{fill:#0969da}.divider{stroke:#d8dee4}}
  </style>
  <rect class="card" x="0.5" y="0.5" width="899" height="285" rx="12"/>
  <text class="title" x="28" y="38">GitHub Activity</text>
  <line class="divider" x1="28" y1="55" x2="872" y2="55"/>
  <g transform="translate(32 76)"><text class="value" x="0" y="28">57</text><text class="label" x="0" y="50">Public repos</text></g><g transform="translate(246 76)"><text class="value" x="0" y="28">12</text><text class="label" x="0" y="50">Followers</text></g><g transform="translate(460 76)"><text class="value" x="0" y="28">2</text><text class="label" x="0" y="50">Stars earned</text></g><g transform="translate(674 76)"><text class="value" x="0" y="28">564</text><text class="label" x="0" y="50">Pull requests</text></g>
  <g transform="translate(32 151)"><text class="value" x="0" y="28">530</text><text class="label" x="0" y="50">Merged PRs</text></g><g transform="translate(246 151)"><text class="value" x="0" y="28">40</text><text class="label" x="0" y="50">Issues</text></g><g transform="translate(460 151)"><text class="value" x="0" y="28">1</text><text class="label" x="0" y="50">PR reviews</text></g>
  <g transform="translate(674 151)"><text class="accent" x="0" y="28">94.0%</text><text class="label" x="0" y="50">PR merge rate</text></g>
  <text class="note" x="28" y="261">Public GitHub data · refreshed daily by GitHub Actions · private professional work is not included</text>
</svg>