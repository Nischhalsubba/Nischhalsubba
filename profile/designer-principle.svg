<svg width="420" height="220" viewBox="0 0 420 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Product design principle</title>
  <desc id="desc">A restrained editorial card highlighting the principle: Make complexity easier to reason about.</desc>
  <rect x="1" y="1" width="418" height="218" rx="18" fill="#11161D" stroke="#2E3741"/>
  <rect x="28" y="28" width="34" height="3" rx="1.5" fill="#63798E"/>
  <text x="30" y="78" fill="#F0F2F5" font-family="Arial, sans-serif" font-size="24" font-weight="600">Make complexity</text>
  <text x="30" y="111" fill="#F0F2F5" font-family="Arial, sans-serif" font-size="24" font-weight="600">easier to reason about.</text>
  <line x1="30" y1="148" x2="390" y2="148" stroke="#313A44"/>
  <text x="30" y="178" fill="#7D8792" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">PRODUCT DESIGN PRINCIPLE</text>
  <text x="30" y="201" fill="#69737F" font-family="Arial, sans-serif" font-size="11">Clarity · Systems · Delivery</text>
</svg>