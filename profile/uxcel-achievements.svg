<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Uxcel design achievements</title>
  <desc id="desc">Uxcel Hall of Fame, verified UI Designer certification, mentor status, learning activity, and selected achievements for Nischhal Raj Subba.</desc>
  <style>
    .bg{fill:#0D1117;stroke:#2E3741}.panel{fill:#11161D;stroke:#303944}.eyebrow{fill:#77818C;font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:2px}.title{fill:#EEF1F4;font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.big{fill:#EEF1F4;font:750 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#B2BAC3;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.pill{fill:#151B22;stroke:#36404A}.pilltext{fill:#AEB8C2;font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.accent{fill:#667C91}.accentStroke{stroke:#667C91}
    @media(prefers-color-scheme:light){.bg{fill:#FFFFFF;stroke:#D0D7DE}.panel{fill:#F6F8FA;stroke:#D8DEE4}.title,.big{fill:#1F2328}.label{fill:#3D444D}.eyebrow{fill:#656D76}.pill{fill:#FFFFFF;stroke:#D0D7DE}.pilltext{fill:#4B5563}.accent{fill:#4F6478}.accentStroke{stroke:#4F6478}}
  </style>

  <rect class="bg" x="0.5" y="0.5" width="899" height="299" rx="16"/>
  <text class="eyebrow" x="28" y="31">DESIGN CREDENTIALS · UXCEL</text>
  <text class="title" x="28" y="57">Independent proof of design practice and continuous learning</text>
  <rect x="744" y="24" width="128" height="34" rx="8" class="pill"/>
  <text class="pilltext" x="808" y="45" text-anchor="middle">VIEW PROFILE ↗</text>

  <g transform="translate(28 82)">
    <rect class="panel" width="196" height="112" rx="12"/>
