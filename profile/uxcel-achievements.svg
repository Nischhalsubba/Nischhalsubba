    <text class="big" x="22" y="70">2023</text>
    <text class="label" x="22" y="92">Uxcel Hall of Fame</text>
  </g>

  <g transform="translate(240 82)">
    <rect class="panel" width="196" height="112" rx="12"/>
    <circle cx="28" cy="29" r="11" fill="none" class="accentStroke" stroke-width="2"/>
