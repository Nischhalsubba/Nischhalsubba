<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Product design process</title>
  <desc id="desc">Four-stage product design process: frame, structure, prototype, and ship.</desc>
  <rect width="1200" height="300" rx="22" fill="#0D1117" stroke="#2B333D"/>
  <path d="M142 94H1058" stroke="#343E49" stroke-width="2"/>

  <g font-family="Arial, sans-serif">
    <g>
      <circle cx="142" cy="94" r="18" fill="#151C23" stroke="#60758A" stroke-width="2"/>
      <text x="142" y="100" text-anchor="middle" fill="#B9C8D6" font-size="13" font-weight="700">01</text>
      <text x="90" y="154" fill="#EEF1F4" font-size="21" font-weight="700">Frame</text>
      <text x="90" y="184" fill="#98A2AD" font-size="14">Problem, user, risk,</text>
      <text x="90" y="207" fill="#98A2AD" font-size="14">constraints, outcome.</text>
    </g>

    <g>
      <circle cx="447" cy="94" r="18" fill="#151C23" stroke="#60758A" stroke-width="2"/>
      <text x="447" y="100" text-anchor="middle" fill="#B9C8D6" font-size="13" font-weight="700">02</text>
      <text x="392" y="154" fill="#EEF1F4" font-size="21" font-weight="700">Structure</text>
      <text x="392" y="184" fill="#98A2AD" font-size="14">Flows, information,</text>
      <text x="392" y="207" fill="#98A2AD" font-size="14">states, permissions.</text>
    </g>

    <g>
      <circle cx="752" cy="94" r="18" fill="#151C23" stroke="#60758A" stroke-width="2"/>
      <text x="752" y="100" text-anchor="middle" fill="#B9C8D6" font-size="13" font-weight="700">03</text>
      <text x="690" y="154" fill="#EEF1F4" font-size="21" font-weight="700">Prototype</text>
      <text x="690" y="184" fill="#98A2AD" font-size="14">Behavior, interaction,</text>
      <text x="690" y="207" fill="#98A2AD" font-size="14">visual direction.</text>
    </g>

    <g>
      <circle cx="1058" cy="94" r="18" fill="#151C23" stroke="#60758A" stroke-width="2"/>
      <text x="1058" y="100" text-anchor="middle" fill="#B9C8D6" font-size="13" font-weight="700">04</text>
      <text x="1004" y="154" fill="#EEF1F4" font-size="21" font-weight="700">Ship</text>
      <text x="1004" y="184" fill="#98A2AD" font-size="14">Systems, handoff,</text>
      <text x="1004" y="207" fill="#98A2AD" font-size="14">quality, continuity.</text>
    </g>
  </g>

  <text x="90" y="258" fill="#66717D" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.1">RESEARCH → INFORMATION → INTERACTION → IMPLEMENTATION</text>
</svg>