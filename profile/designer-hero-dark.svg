<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nischhal Raj Subba — Senior Product Designer</title>
  <desc id="desc">Dark designer portfolio banner focused on complex products, clear decisions, design systems, and implementation.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="32" x2="1110" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111625"/>
      <stop offset="0.55" stop-color="#090D15"/>
      <stop offset="1" stop-color="#0B0D13"/>
    </linearGradient>
    <linearGradient id="aurora" x1="760" y1="70" x2="1110" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F36DB7"/>
      <stop offset="0.45" stop-color="#8A63FF"/>
      <stop offset="1" stop-color="#4CA8FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(946 250) rotate(90) scale(285)">
      <stop stop-color="#8A63FF" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#4CA8FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4CA8FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="30" fill="url(#bg)" stroke="#2B3242"/>
  <rect x="1" y="1" width="1198" height="558" rx="30" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="558" rx="30" fill="url(#glow)"/>

  <g transform="translate(62 54)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#AAB2C3" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3.1">SENIOR PRODUCT DESIGNER · KATHMANDU · REMOTE</text>

    <text x="0" y="96" fill="#F7F8FC" font-family="Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2.4">Complex products.</text>
    <text x="0" y="176" fill="#F7F8FC" font-family="Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2.4">Clear <tspan fill="url(#aurora)">decisions.</tspan></text>

    <text x="2" y="230" fill="#B5BDCC" font-family="Arial, sans-serif" font-size="20">SaaS · Fintech · Web3 · Design Systems · Design-to-Engineering</text>

    <g transform="translate(0 282)">
      <rect width="154" height="44" rx="22" fill="#F7F8FC"/>
      <text x="77" y="28" text-anchor="middle" fill="#0B0D13" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">CLARITY</text>
      <rect x="166" width="154" height="44" rx="22" fill="#141A27" stroke="#394155"/>
      <text x="243" y="28" text-anchor="middle" fill="#E7EAF1" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">SYSTEMS</text>
      <rect x="332" width="154" height="44" rx="22" fill="#141A27" stroke="#394155"/>
      <text x="409" y="28" text-anchor="middle" fill="#E7EAF1" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">DELIVERY</text>
    </g>

    <line x1="0" y1="374" x2="520" y2="374" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="0" y="412" fill="#8F98AA" font-family="Arial, sans-serif" font-size="14" letter-spacing="0.4">01 / problem → 02 / rules → 03 / states → 04 / system → 05 / ship</text>
  </g>

  <g transform="translate(724 42)">
    <circle cx="224" cy="230" r="168" fill="#7B61FF" fill-opacity="0.11" filter="url(#soft)"/>

    <g transform="rotate(-10 230 230)">
      <rect x="34" y="52" width="294" height="184" rx="24" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <rect x="54" y="78" width="132" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.18"/>
      <rect x="54" y="106" width="214" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="54" y="126" width="184" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="54" y="160" width="112" height="48" rx="14" fill="#F7F8FC"/>
      <text x="110" y="190" text-anchor="middle" fill="#0B0D13" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PRIMARY</text>
    </g>

    <g transform="rotate(8 230 230)">
      <rect x="170" y="168" width="274" height="184" rx="24" fill="#0F1522" stroke="#7E8AA8" stroke-opacity="0.36"/>
      <rect x="194" y="194" width="74" height="74" rx="20" fill="url(#aurora)"/>
      <rect x="286" y="194" width="132" height="14" rx="7" fill="#E9ECF4" fill-opacity="0.86"/>
      <rect x="286" y="222" width="108" height="9" rx="4.5" fill="#8E99AF" fill-opacity="0.55"/>
      <rect x="194" y="290" width="224" height="34" rx="10" fill="#151D2B" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="212" y="312" fill="#AFB7C7" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.2">STATE / READY FOR HANDOFF</text>
    </g>

    <g transform="translate(24 374)">
      <rect width="420" height="82" rx="18" fill="#0F141F" stroke="#323B4F"/>
      <text x="22" y="28" fill="#7E8AA2" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">DESIGN PRINCIPLE</text>
      <text x="22" y="56" fill="#F0F2F7" font-family="Georgia, serif" font-size="20" font-style="italic">Make complexity easier to reason about.</text>
    </g>
  </g>
</svg>
