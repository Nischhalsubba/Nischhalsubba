<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nischhal Raj Subba, product designer</title>
  <desc id="desc">Editorial portfolio banner about making complex products feel clear.</desc>
  <defs>
    <linearGradient id="accent" x1="760" y1="80" x2="1110" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6457FF"/>
      <stop offset="0.54" stop-color="#72D7F5"/>
      <stop offset="1" stop-color="#FF806B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(948 296) rotate(90) scale(246)">
      <stop stop-color="#6457FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6457FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#11131A" stroke-opacity="0.06"/>
    </pattern>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="32" fill="#F6F2E8"/>
  <rect width="1200" height="620" rx="32" fill="url(#grid)"/>
  <rect width="1200" height="620" rx="32" fill="url(#halo)"/>

  <g filter="url(#grain)">
    <text x="64" y="72" fill="#11131A" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3.2">NISCHHAL RAJ SUBBA / PRODUCT DESIGNER</text>
    <line x1="64" y1="92" x2="600" y2="92" stroke="#11131A" stroke-opacity="0.22"/>

    <text x="64" y="200" fill="#11131A" font-family="Georgia, serif" font-size="82" font-weight="700">Making complex</text>
    <text x="64" y="292" fill="#11131A" font-family="Georgia, serif" font-size="82" font-weight="700">products feel clear.</text>

    <text x="68" y="354" fill="#3E4048" font-family="Arial, sans-serif" font-size="22">Product strategy, UX systems, interaction design, and design-to-development.</text>

    <g transform="translate(64 424)">
      <rect width="176" height="52" rx="26" fill="#11131A"/>
      <text x="88" y="33" text-anchor="middle" fill="#F6F2E8" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">CLARITY</text>
      <rect x="190" width="176" height="52" rx="26" fill="#E8E2D5" stroke="#11131A" stroke-opacity="0.2"/>
      <text x="278" y="33" text-anchor="middle" fill="#11131A" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">SYSTEMS</text>
      <rect x="380" width="176" height="52" rx="26" fill="#E8E2D5" stroke="#11131A" stroke-opacity="0.2"/>
      <text x="468" y="33" text-anchor="middle" fill="#11131A" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">TRUST</text>
    </g>

    <text x="66" y="555" fill="#5C5D64" font-family="Arial, sans-serif" font-size="15">Based in Nepal / Designing for global digital products</text>

    <g transform="translate(744 58)">
      <circle cx="214" cy="242" r="206" stroke="#11131A" stroke-opacity="0.12"/>
      <circle cx="214" cy="242" r="148" stroke="#11131A" stroke-opacity="0.14" stroke-dasharray="5 12"/>
      <circle cx="214" cy="242" r="88" fill="url(#accent)" fill-opacity="0.14" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="214" cy="242" r="12" fill="#6457FF"/>
      <path d="M62 94L366 390" stroke="url(#accent)" stroke-width="3"/>
      <path d="M364 94L66 390" stroke="#11131A" stroke-opacity="0.16"/>

      <rect x="18" y="36" width="166" height="92" rx="18" fill="#11131A"/>
      <text x="38" y="68" fill="#9EA2AF" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.6">DESIGN SYSTEM</text>
      <text x="38" y="104" fill="#F6F2E8" font-family="Georgia, serif" font-size="30" font-weight="700">NRS / 01</text>

      <rect x="236" y="360" width="218" height="110" rx="20" fill="#FFFFFF" stroke="#11131A" stroke-opacity="0.14"/>
      <text x="260" y="392" fill="#6D6E75" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.6">CURRENT FOCUS</text>
      <text x="260" y="424" fill="#11131A" font-family="Arial, sans-serif" font-size="15" font-weight="700">Complex workflows</text>
      <text x="260" y="450" fill="#11131A" font-family="Arial, sans-serif" font-size="15" font-weight="700">made understandable</text>

      <text x="28" y="512" fill="#11131A" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">01 RESEARCH / 02 STRUCTURE / 03 SYSTEM / 04 SHIP</text>
    </g>
  </g>
</svg>
