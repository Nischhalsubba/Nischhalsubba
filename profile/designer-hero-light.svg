<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nischhal Raj Subba — Senior Product Designer</title>
  <desc id="desc">Light designer portfolio banner focused on complex products, clear decisions, design systems, and implementation.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="32" x2="1110" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F5EE"/>
      <stop offset="0.55" stop-color="#F4F1EA"/>
      <stop offset="1" stop-color="#ECE8E0"/>
    </linearGradient>
    <linearGradient id="aurora" x1="760" y1="70" x2="1110" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8428D"/>
      <stop offset="0.45" stop-color="#6C4EEA"/>
      <stop offset="1" stop-color="#2276D2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E3DED5" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(946 250) rotate(90) scale(285)">
      <stop stop-color="#7859EE" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#4C9EF0" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#4C9EF0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#11131A" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="30" fill="url(#bg)" stroke="#D5D0C8"/>
  <rect x="1" y="1" width="1198" height="558" rx="30" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="558" rx="30" fill="url(#glow)"/>

  <g transform="translate(62 54)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#676C79" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3.1">SENIOR PRODUCT DESIGNER · KATHMANDU · REMOTE</text>

    <text x="0" y="96" fill="#15171D" font-family="Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2.4">Complex products.</text>
    <text x="0" y="176" fill="#15171D" font-family="Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2.4">Clear <tspan fill="url(#aurora)">decisions.</tspan></text>

    <text x="2" y="230" fill="#535966" font-family="Arial, sans-serif" font-size="20">SaaS · Fintech · Web3 · Design Systems · Design-to-Engineering</text>

    <g transform="translate(0 282)">
      <rect width="154" height="44" rx="22" fill="#17191F"/>
      <text x="77" y="28" text-anchor="middle" fill="#F8F5EE" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">CLARITY</text>
      <rect x="166" width="154" height="44" rx="22" fill="#EBE6DD" stroke="#BEB8AE"/>
      <text x="243" y="28" text-anchor="middle" fill="#20232A" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">SYSTEMS</text>
      <rect x="332" width="154" height="44" rx="22" fill="#EBE6DD" stroke="#BEB8AE"/>
      <text x="409" y="28" text-anchor="middle" fill="#20232A" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">DELIVERY</text>
    </g>

    <line x1="0" y1="374" x2="520" y2="374" stroke="#11131A" stroke-opacity="0.1"/>
    <text x="0" y="412" fill="#737987" font-family="Arial, sans-serif" font-size="14" letter-spacing="0.4">01 / problem → 02 / rules → 03 / states → 04 / system → 05 / ship</text>
  </g>

  <g transform="translate(724 42)">
    <circle cx="224" cy="230" r="168" fill="#7B61FF" fill-opacity="0.09" filter="url(#soft)"/>

    <g transform="rotate(-10 230 230)">
      <rect x="34" y="52" width="294" height="184" rx="24" fill="url(#glass)" stroke="#AAA49B" stroke-opacity="0.6"/>
      <rect x="54" y="78" width="132" height="12" rx="6" fill="#1D2027" fill-opacity="0.18"/>
      <rect x="54" y="106" width="214" height="8" rx="4" fill="#1D2027" fill-opacity="0.08"/>
      <rect x="54" y="126" width="184" height="8" rx="4" fill="#1D2027" fill-opacity="0.08"/>
      <rect x="54" y="160" width="112" height="48" rx="14" fill="#17191F"/>
      <text x="110" y="190" text-anchor="middle" fill="#F8F5EE" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PRIMARY</text>
    </g>

    <g transform="rotate(8 230 230)">
      <rect x="170" y="168" width="274" height="184" rx="24" fill="#FFFFFF" stroke="#B7B0A7"/>
      <rect x="194" y="194" width="74" height="74" rx="20" fill="url(#aurora)"/>
      <rect x="286" y="194" width="132" height="14" rx="7" fill="#1C1F26" fill-opacity="0.82"/>
      <rect x="286" y="222" width="108" height="9" rx="4.5" fill="#707682" fill-opacity="0.38"/>
      <rect x="194" y="290" width="224" height="34" rx="10" fill="#F3EFE8" stroke="#D5D0C7"/>
      <text x="212" y="312" fill="#686F7C" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.2">STATE / READY FOR HANDOFF</text>
    </g>

    <g transform="translate(24 374)">
      <rect width="420" height="82" rx="18" fill="#FFFFFF" stroke="#CBC5BC"/>
      <text x="22" y="28" fill="#7C817E" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">DESIGN PRINCIPLE</text>
      <text x="22" y="56" fill="#181B22" font-family="Georgia, serif" font-size="20" font-style="italic">Make complexity easier to reason about.</text>
    </g>
  </g>
</svg>
