name: Reusable interactive README standard

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interactive-readme-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-readmes:
    if: github.repository != 'Nischhalsubba/Nischhalsubba'
    runs-on: ubuntu-latest
    env:
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GENERATOR_VERSION: aed303eed8a536f2dda075c8be583693325aac37
      GENERATOR_URL: https://raw.githubusercontent.com/Nischhalsubba/Nischhalsubba/aed303eed8a536f2dda075c8be583693325aac37/.github/readme-standard/generate.py
    steps:
      - name: Update every branch README
        shell: bash
        run: |
          set -u

          curl --fail --silent --show-error --location "${GENERATOR_URL}" --output /tmp/generate-readme.py
          python3 -m py_compile /tmp/generate-readme.py

          git init .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          REPORT_FILE="$(mktemp)"
          {
            echo "# Interactive README automation report"
            echo
            echo "Repository: \`${REPOSITORY}\`"
            echo
            echo "Generator: \`${GENERATOR_VERSION}\`"
            echo
            echo "| Branch | Result | Detail |"
            echo "|---|---|---|"
          } > "${REPORT_FILE}"

          FAILURES=0

          while IFS= read -r BRANCH_NAME; do
            if [ -z "${BRANCH_NAME}" ] || [ "${BRANCH_NAME}" = "HEAD" ]; then
              continue
            fi

            git reset --hard >/dev/null 2>&1 || true
            git clean -fdx >/dev/null 2>&1 || true

            if ! git checkout -B "${BRANCH_NAME}" "origin/${BRANCH_NAME}" >/dev/null 2>&1; then
              printf '| `%s` | failed | Could not check out branch |\n' "${BRANCH_NAME}" >> "${REPORT_FILE}"
              FAILURES=$((FAILURES + 1))
              continue
            fi

            export BRANCH_NAME
            if ! python3 /tmp/generate-readme.py; then
              printf '| `%s` | failed | README generator failed |\n' "${BRANCH_NAME}" >> "${REPORT_FILE}"
              FAILURES=$((FAILURES + 1))
              continue
            fi

            if git diff --quiet -- README.md; then
              printf '| `%s` | unchanged | README already matched the standard |\n' "${BRANCH_NAME}" >> "${REPORT_FILE}"
              continue
            fi

            git add README.md
            if ! git commit -m "docs: apply designer README standard" >/dev/null 2>&1; then
              printf '| `%s` | failed | Could not create README commit |\n' "${BRANCH_NAME}" >> "${REPORT_FILE}"
              FAILURES=$((FAILURES + 1))
              continue
            fi

            if git push origin "HEAD:${BRANCH_NAME}" >/dev/null 2>&1; then
              printf '| `%s` | updated | Branch-specific README committed |\n' "${BRANCH_NAME}" >> "${REPORT_FILE}"
            else
              printf '| `%s` | failed | Push rejected, commonly due to branch protection |\n' "${BRANCH_NAME}" >> "${REPORT_FILE}"
              FAILURES=$((FAILURES + 1))
            fi
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort)

          git fetch origin "${DEFAULT_BRANCH}" >/dev/null 2>&1 || true
          git reset --hard >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true

          if git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}" >/dev/null 2>&1; then
            mkdir -p .github
            cp "${REPORT_FILE}" .github/README_AUTOMATION_REPORT.md
            git add .github/README_AUTOMATION_REPORT.md
            if ! git diff --cached --quiet; then
              git commit -m "docs: record README automation results" >/dev/null 2>&1 || true
              git push origin "HEAD:${DEFAULT_BRANCH}" >/dev/null 2>&1 || true
            fi
          fi

          cat "${REPORT_FILE}"

          if [ "${FAILURES}" -gt 0 ]; then
            echo "${FAILURES} branch update(s) failed. Review the report committed to the default branch."
            exit 1
          fi
